# Render Blueprint — auto-configures the Web Service.
# Render → New → Blueprint → pick this repo, and these settings are applied.
services:
  - type: web
    name: customer-feedback-analysis-agent
    runtime: python
    plan: free
    region: singapore          # closest free region to India; change if you like
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api.index:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: MAX_ROWS
        value: "5000"          # Render has no 10s limit, so raise the cap
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false            # set this yourself in the Render dashboard
